<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common :: meta_header('貸出登録',~{::link},~{::script})}">
    <title th:text="${title}+' | MTLibrary'"></title>
    <link rel="stylesheet" th:href="@{/css/rental/add.css}" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>
    <div class="contents">
        <div th:replace="~{common :: main_sidebar}"></div>
        <div class="main_contents">
            <div th:replace="~{common :: header}"></div>
            <div class="inner_contens">
                <div class="page_title">貸出登録</div>
                <div class="mb30 flexarea">
                    <span class="text-red">＊は必須項目です</span>
                    <span>
                        <a th:href="@{/rental/index}" class="link">← 一覧へ戻る</a>
                    </span>
                </div>
                <form id="rental_add_form" th:object="${rentalManageDto}" th:action="@{/rental/add}" method="post">
                    <div class="mb30">
                        <label class="input_title" for="employeeId">社員番号<span class="text-red asterisk">＊</span></label>
                        <select id="employeeId" class="form_input" th:field="*{employeeId}" name="employeeId">
                            <option value="">社員番号を選択</option>
                            <option th:each="account : ${accounts}" th:value="${account.employeeId}"
                                th:text="${account.employeeId + ' ' + account.name}"
                                th:selected="${account.employeeId == rentalManageDto.employeeId}"></option>
                        </select>
                        <div class="error_msg" th:if="${#fields.hasErrors('employeeId')}" th:errors="*{employeeId}">
                        </div>
                    </div>
                    <div class="mb30">
                        <label class="input_title" for="expectedRentalOn">貸出予定日<span
                                class="text-red asterisk">＊</span></label>
                        <div class="date_input_area">
                            <input type="text" id="expectedRentalOn" class="form_input" name="expectedRentalOn"
                                th:value="${rentalManageDto.expectedRentalOn}" placeholder="年/月/日" maxlength="10"
                                oninput="formatDateInput(this)">
                            <button type="button" id="rentalCalendarBtn" class="calendar_btn">
                                <span class="material-symbols-outlined">calendar_month</span>
                            </button>
                        </div>
                        <div class="error_msg" th:if="${#fields.hasErrors('expectedRentalOn')}"
                            th:errors="*{expectedRentalOn}">
                        </div>
                    </div>
                    <div class="mb30">
                        <label class="input_title" for="expectedReturnOn">返却予定日<span
                                class="text-red asterisk">＊</span></label>
                        <div class="date_input_area">
                            <input type="text" id="expectedReturnOn" class="form_input" name="expectedReturnOn"
                                th:value="${rentalManageDto.expectedReturnOn}" placeholder="年/月/日" maxlength="10"
                                oninput="formatDateInput(this)">
                            <button type="button" id="returnCalendarBtn" class="calendar_btn">
                                <span class="material-symbols-outlined">calendar_month</span>
                            </button>
                        </div>
                        <div class="error_msg" th:if="${#fields.hasErrors('expectedReturnOn')}"
                            th:errors="*{expectedReturnOn}">
                        </div>
                    </div>
                    <div class="mb30">
                        <label class="input_title" for="stockMngNumber">在庫管理番号<span
                                class="text-red asterisk">＊</span></label>
                        <select id="stockMngNumber" class="form_input" name="stockId">
                            <option value="">在庫管理番号を選択</option>
                            <option th:each="stock : ${stockList}" th:value="${stock.id}"
                                th:text="${stock.id + ' ' + stock.bookMst.title}"
                                th:selected="${stock.id == rentalManageDto.stockId}"></option>
                        </select>
                        <div class="error_msg" th:if="${#fields.hasErrors('stockId')}" th:errors="*{stockId}"></div>
                    </div>
                    <div class="mb30">
                        <label class="input_title" for="rentalStatus">貸出ステータス<span
                                class="text-red asterisk">＊</span></label>
                        <select id="rentalStatus" class="form_input" name="status">
                            <option value="">ステータスを選択</option>
                            <option th:each="status : ${rentalStatus}" th:value="${status.key}"
                                th:text="${status.value}" th:selected="${status.value == rentalManageDto.status}">
                            </option>
                        </select>
                        <div class="error_msg" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                    </div>
                    <div class="btn_block">
                        <button type="submit" id="submit_btn">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div th:replace="~{common :: footer}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        function formatDateInput(input) {
            var v = input.value.replace(/[^0-9]/g, '');

            if (v.length > 4) {
                v = v.slice(0, 4) + '/' + v.slice(4);
            }

            if (v.length > 7) {
                v = v.slice(0, 7) + '/' + v.slice(7);
            }

            input.value = v.slice(0, 10);
        }
        document.addEventListener("DOMContentLoaded", function () {
            const rentalPicker = flatpickr("#expectedRentalOn", {
                dateFormat: "Y/m/d",
                allowInput: true,
                clickOpens: false
            });
            const returnPicker = flatpickr("#expectedReturnOn", {
                dateFormat: "Y/m/d",
                allowInput: true,
                clickOpens: false
            });
            document.getElementById("rentalCalendarBtn").addEventListener("click", function () {
                rentalPicker.open();
            });
            document.getElementById("returnCalendarBtn").addEventListener("click", function () {
                returnPicker.open();
            });
        });
    </script>
</body>
