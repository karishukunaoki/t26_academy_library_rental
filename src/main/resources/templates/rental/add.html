<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common :: meta_header('貸出登録',~{::link},~{::script})}">
    <title>貸出登録 | MTLibrary</title>
    <link rel="stylesheet" th:href="@{/css/rental/add.css}" />
    <script type="text/javascript" th:src="@{/js/rental/add.js}"></script>
</head>

<body>
    <div class="contents">

        <div th:replace="~{common :: main_sidebar}"></div>

        <div class="main_contents">

            <div th:replace="~{common :: header}"></div>

            <div class="inner_contens">

                <div class="page_title">貸出登録</div>

                <div class="mb30 flexarea">
                    <span class="text-red">＊は必須項目です</span>
                    <span>
                        <a th:href="@{/rental/index}" class="link">← 一覧へ戻る</a>
                    </span>
                </div>

                <!-- 保存メッセージ -->
                <div th:if="${message}" class="mb30" style="color: green;">
                    <span th:text="${message}"></span>
                </div>

                <form id="rental_add_form" th:object="${rentalManageDto}" th:action="@{/rental/add}" method="post">

                    <!-- 社員番号 -->
                    <div class="mb30">
                        <label class="input_title" for="employeeId">
                            社員番号
                            <span class="text-red asterisk">＊</span>
                        </label>

                        <select id="employeeId" class="form_input" th:field="*{employeeId}" required>

                            <option value="">社員番号を選択</option>

                            <!-- valueには番号だけ送る -->
                            <option th:each="account : ${accounts}" th:value="${#strings.substringBefore(account,' ')}"
                                th:text="${account}">
                            </option>

                        </select>

                        <div class="error_msg" th:if="${#fields.hasErrors('employeeId')}" th:errors="*{employeeId}">
                        </div>
                    </div>

                    <!-- 貸出予定日 -->
                    <div class="mb30">
                        <label class="input_title" for="expectedRentalOn">
                            貸出予定日
                            <span class="text-red asterisk">＊</span>
                        </label>

                        <input type="date" id="expectedRentalOn" class="form_input" th:field="*{expectedRentalOn}"
                            required>

                        <div class="error_msg" th:if="${#fields.hasErrors('expectedRentalOn')}"
                            th:errors="*{expectedRentalOn}">
                        </div>
                    </div>

                    <!-- 返却予定日 -->
                    <div class="mb30">
                        <label class="input_title" for="expectedReturnOn">
                            返却予定日
                            <span class="text-red asterisk">＊</span>
                        </label>

                        <input type="date" id="expectedReturnOn" class="form_input" th:field="*{expectedReturnOn}"
                            required>

                        <div class="error_msg" th:if="${#fields.hasErrors('expectedReturnOn')}"
                            th:errors="*{expectedReturnOn}">
                        </div>
                    </div>

                    <!-- 在庫管理番号 -->
                    <div class="mb30">
                        <label class="input_title" for="stockId">
                            在庫管理番号
                            <span class="text-red asterisk">＊</span>
                        </label>

                        <select id="stockId" class="form_input" th:field="*{stockId}" required>

                            <option value="">在庫管理番号を選択</option>

                            <!-- valueには A00001 だけ送る -->
                            <option th:each="stock : ${stocks}" th:value="${#strings.substringBefore(stock,' ')}"
                                th:text="${stock}">
                            </option>

                        </select>

                        <div class="error_msg" th:if="${#fields.hasErrors('stockId')}" th:errors="*{stockId}">
                        </div>
                    </div>

                    <!-- 貸出ステータス -->
                    <div class="mb30">
                        <label class="input_title" for="status">
                            貸出ステータス
                            <span class="text-red asterisk">＊</span>
                        </label>

                        <select id="status" class="form_input" th:field="*{status}" required>

                            <option value="">ステータスを選択</option>

                            <option th:each="status : ${rentalStatus}" th:value="${status}" th:text="${status}">
                            </option>

                        </select>

                        <div class="error_msg" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">
                        </div>
                    </div>

                    <!-- 保存ボタン -->
                    <div class="btn_block">
                        <button type="submit" id="submit_btn">
                            保存
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <div th:replace="~{common :: footer}"></div>

</body>

</html>
